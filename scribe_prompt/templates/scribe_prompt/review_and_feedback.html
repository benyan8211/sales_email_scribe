{% extends 'scribe_prompt/scribe_prompt_container.html' %}
{% load static %}

{% block sub_css_files %}
    <link rel="stylesheet" href="{% static 'scribe_prompt/css/review_and_feedback.css' %}">
{% endblock %}

{% block subcontent %}
    <!-- This shows up instantly -->
    <div id="loading-container" class="loading_container">
        <div class="spinner"></div>
        <p style="text-align: center;">Processing your request, please wait...</p>
    </div>

    <!-- The view will stream content directly into here -->
    <div id="content-container" class="hidden"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("{% url 'slow-processing' %}")
            .then(response => {
                    if (!response.ok) throw new Error("Server error");
                    return response.text();
                })
                .then(pythonHtmlResult => {
                    const outputDiv = document.getElementById("content-container");
                    
                    outputDiv.innerHTML += pythonHtmlResult;
                    
                    document.getElementById("loading-container").classList.add("hidden");
                    outputDiv.classList.remove("hidden");
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("loading-screen").innerHTML = "<p style='color:red; text-align:center;'>Python execution failed.</p>";
                });
        });
    </script>
{% endblock %}
