{% extends 'base.html' %}
{% load static %}

{% block css_files %}
    <link rel="stylesheet" href="{% static 'scribe_prompt/css/scribe_prompt_container.css' %}">
    {% block sub_css_files %}{% endblock %}
{% endblock %}

{% block content %}
    <div class="stepper-container">
        <ol class="stepper-list">
            <li class="step {% if current_step > 1 %}done{% elif current_step == 1 %}active{% endif %}">
                <span class="circle">1</span>
                <span class="label">Intake Form</span>
            </li>
            <li class="step {% if current_step > 2 %}done{% elif current_step == 2 %}active{% endif %}">
                <span class="circle">2</span>
                <span class="label">Review & Feedback</span>
            </li>
            <li class="step {% if current_step >= 3 %}done{% elif current_step == 3 %}active{% endif %}">
                <span class="circle">3</span>
                <span class="label">Confirmation</span>
            </li>
        </ol>
    </div>
    <script>
        function displayFormErrors(errors) {
            // 1. Instantly find and remove all old error elements from the page
            document.querySelectorAll('.field_error').forEach(el => el.remove());

            // 2. Loop through the new errors sent by Django
            for (const [fieldName, errorList] of Object.entries(errors)) {
                // Find the input element by its HTML "name" attribute
                let inputField = document.querySelector(`[name="${fieldName}"]`);

                
                if (inputField) {
                    // Django's get_json_data() nests the message inside an array of objects
                    const errorMessageText = errorList[0].message; 

                    // Create a new text element for the error
                    const errorElement = document.createElement('small');
                    errorElement.className = 'field_error'; // Matches the selector above
                    errorElement.innerText = errorMessageText;

                    if (fieldName === "tone_of_email") {
                        inputField.parentNode.parentNode.after(errorElement);
                    } else {
                        // Insert the error directly below the incorrect input field
                        inputField.parentNode.after(errorElement);
                    }
                }
            }
        }

        function renderErrorBox() {
            const messageWrapper = document.getElementById('django-error-messages-wrapper');
    
            if (messageWrapper) {
                // Clear any previous error boxes so they don't stack indefinitely
                messageWrapper.innerHTML = ''; 

                // 2. Build the precise HTML structure matching your Django template
                const alertBox = document.createElement('div');
                alertBox.className = 'alert-box alert-error';
                alertBox.style.width = '465px';
                alertBox.style.justifySelf = 'center';

                const textSpan = document.createElement('span');
                // Fallback message if your error object doesn't contain a clean text string
                textSpan.textContent = 'An unexpected error occurred! Please try again later.'; 

                const closeBtn = document.createElement('button');
                closeBtn.className = 'alert-close-btn';
                closeBtn.innerHTML = '&times;';
                closeBtn.onclick = function() {
                    this.parentElement.remove();
                };

                // 3. Assemble the elements and inject them into the page layout
                alertBox.appendChild(textSpan);
                alertBox.appendChild(closeBtn);
                messageWrapper.appendChild(alertBox);
            }
        }
        const login_status = document.getElementById("login-status");
        login_status.classList.remove("hidden");
    </script>
    {% block subcontent %}{% endblock %}
{% endblock %}
